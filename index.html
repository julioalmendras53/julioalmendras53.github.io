// Captura cualquier error no atrapado y lo muestra en rojo dentro del div de definición
window.addEventListener('error', e => {
  const out = document.getElementById('definition');
  out.innerHTML = `
    <pre style="color: red; white-space: pre-wrap;">
      Error: ${e.message}
      at ${e.filename}:${e.lineno}:${e.colno}
    </pre>
  `;
  // Evitamos que el error siga propagándose
  e.preventDefault();
});

  // Ordena automáticamente las entradas del diccionario por alfabeto español
const collatorEs = new Intl.Collator('es', {
  sensitivity: 'base',
  numeric: true
});

function sortDictionaryAlphabetically(obj) {
  const sortedEntries = Object.entries(obj).sort(([a], [b]) =>
    collatorEs.compare(a, b)
  );

  for (const key of Object.keys(obj)) {
    delete obj[key];
  }

  for (const [key, value] of sortedEntries) {
    obj[key] = value;
  }
}

sortDictionaryAlphabetically(dictionary);
    let savedImages = JSON.parse(localStorage.getItem('dictionaryImages') || '{}');
    for (const key in savedImages) {
      if (dictionary[key]) dictionary[key].imagen = savedImages[key];
    }

    // Construye mapa de claves normalizadas → clave original
    const normalizedMap = {};
    for (const key of Object.keys(dictionary)) {
      normalizedMap[ normalizeText(key) ] = key;
    }

    // Genera regex para linkificar y para prueba
    const normalizedKeys = Object.keys(normalizedMap).sort((a,b)=>b.length-a.length);

const alphabeticalKeys = Object.keys(normalizedMap).sort((a, b) =>
  collatorEs.compare(normalizedMap[a], normalizedMap[b])
);
    const linkRegex       = new RegExp('\\b(' + normalizedKeys.join('|') + ')\\b','gi');
    const testLinkRegex   = new RegExp(linkRegex.source,'i');

    // Función que substituye palabras por enlaces
    // Convierte en enlace SOLO palabras enteras del diccionario
function linkify(text, currentKey = "") {
  return text.replace(
    /([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)|([^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)/g,
    (match, word, other) => {
      // Si no es palabra (espacio, coma, punto...), lo dejamos igual
      if (!word) return other;

      // Normalizamos la palabra y miramos si está en el diccionario
      const norm = normalizeText(word);
      const key  = normalizedMap[norm];

      if (key) {
        // Una referencia al propio lema es circular: se mantiene clicable y se marca en rojo.
        const circular = currentKey && normalizeText(key) === normalizeText(currentKey);
        const clase = circular ? ' class="referencia-circular"' : '';
        return `<a${clase} href="#${normalizeText(key)}">${word}</a>`;
      }

      // Si no, la devolvemos tal cual
      return word;
    }
  );
}

    function videoMimeDe(src, fallback) {
      if (fallback) return fallback;
      const s = String(src || '').toLowerCase();
      const data = s.match(/^data:([^;,]+)/);
      if (data) return data[1];
      if (s.includes('.webm')) return 'video/webm';
      return 'video/mp4';
    }

    function openVideoDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('diccionario-videos', 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains('videos')) req.result.createObjectStore('videos');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbPut(term, blob) {
      return openVideoDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction('videos', 'readwrite');
        tx.objectStore('videos').put(blob, term);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { db.close(); reject(tx.error); };
      }));
    }

    function idbGet(term) {
      return openVideoDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction('videos', 'readonly');
        const r = tx.objectStore('videos').get(term);
        r.onsuccess = () => { db.close(); resolve(r.result || null); };
        r.onerror = () => { db.close(); reject(r.error); };
      }));
    }

    async function attachSavedVideos() {
      for (const term of Object.keys(savedVideos)) {
        if (!dictionary[term]) continue;
        try {
          const blob = await idbGet(term);
          if (!blob) continue;
          videoObjectUrls[term] = URL.createObjectURL(blob);
          dictionary[term].video = videoObjectUrls[term];
          dictionary[term].videoMime = savedVideos[term] || blob.type || 'video/mp4';
        } catch (e) {}
      }
    }

const searchInput = document.getElementById('search-input');

// Creamos un <datalist> para las opciones
const suggestionsList = document.createElement('datalist');
suggestionsList.id = 'suggestions-list';

// Lo colocamos justo después del input
searchInput.insertAdjacentElement('afterend', suggestionsList);

// Vinculamos el input con el datalist
searchInput.setAttribute('list', 'suggestions-list');

// Cada vez que el usuario escribe, generamos sugerencias
searchInput.addEventListener('input', () => {
  const query = normalizeText(searchInput.value.trim());
  suggestionsList.innerHTML = '';

  // Si ha escrito muy poco, no sugerimos nada
  if (query.length < 2) return;

  const yaAñadidos = new Set();

  // Recorremos las claves normalizadas del diccionario
  for (const normKey of alphabeticalKeys) {
    // Buscamos las que empiezan por lo escrito: "infini" → infinito, infinitamente, infinitotriz...
    if (normKey.startsWith(query)) {
      const originalKey = normalizedMap[normKey];
      if (!yaAñadidos.has(originalKey)) {
        yaAñadidos.add(originalKey);
        const option = document.createElement('option');
        option.value = originalKey;
        suggestionsList.appendChild(option);
      }
    }
  }
});

    // Búsqueda por imagen visual compatible con navegadores móviles.
    function archivoADataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function cargarImagen(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('No se pudo cargar la imagen'));
        img.src = src;
      });
    }

    async function huellaVisualDesdeSrc(src) {
      const img = await cargarImagen(src);
      const canvas = document.createElement('canvas');
      canvas.width = 32; canvas.height = 32;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      if (!ctx) throw new Error('Canvas no disponible');
      ctx.drawImage(img, 0, 0, 32, 32);
      const d = ctx.getImageData(0, 0, 32, 32).data;
      const gris = new Float32Array(1024);
      const color = new Float32Array(48);
      let media = 0;
      for (let p=0, i=0; i<d.length; i+=4, p++) {
        const g=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)/255;
        gris[p]=g; media+=g;
        const x=p%32, y=Math.floor(p/32), bx=Math.min(3,Math.floor(x/8)), by=Math.min(3,Math.floor(y/8));
        const k=(by*4+bx)*3;
        color[k]+=d[i]/255; color[k+1]+=d[i+1]/255; color[k+2]+=d[i+2]/255;
      }
      media/=1024;
      for(let i=0;i<color.length;i++) color[i]/=64;
      const ahash=new Uint8Array(1024);
      for(let i=0;i<1024;i++) ahash[i]=gris[i]>=media?1:0;
      const dhash=new Uint8Array(31*32);
      let q=0;
      for(let y=0;y<32;y++) for(let x=0;x<31;x++) dhash[q++]=gris[y*32+x] < gris[y*32+x+1] ? 1:0;
      return {gris,color,ahash,dhash};
    }

    function diferenciaBits(a,b) {
      let n=0;
      for(let i=0;i<a.length;i++) if(a[i]!==b[i]) n++;
      return n/a.length;
    }

    function distanciaMedia(a,b) {
      let n=0;
      for(let i=0;i<a.length;i++) n+=Math.abs(a[i]-b[i]);
      return n/a.length;
    }

    function distanciaVisual(a,b) {
      if(!a||!b) return Infinity;
      const forma=(diferenciaBits(a.ahash,b.ahash)+diferenciaBits(a.dhash,b.dhash))/2;
      const color=distanciaMedia(a.color,b.color);
      const tono=distanciaMedia(a.gris,b.gris);
      return forma*.55 + color*.30 + tono*.15;
    }

    // Descriptor v7: histogramas de color y de bordes. Son invariantes a la posición
    // y ayudan a no confundir escenas distintas que casualmente tienen un aHash parecido.
    async function descriptorSemanticoDesdeSrc(src) {
      const img=await cargarImagen(src), cv=document.createElement('canvas');
      cv.width=48;cv.height=48;
      const ctx=cv.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0,48,48);
      const d=ctx.getImageData(0,0,48,48).data, n=48*48;
      const hist=new Float32Array(64), gris=new Float32Array(n);
      for(let p=0,i=0;i<d.length;i+=4,p++){
        const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
        gris[p]=r*.299+g*.587+b*.114;
        const mx=Math.max(r,g,b),mn=Math.min(r,g,b),delta=mx-mn;
        let h=0;
        if(delta){if(mx===r)h=((g-b)/delta)%6;else if(mx===g)h=(b-r)/delta+2;else h=(r-g)/delta+4;h=(h*60+360)%360;}
        const s=mx?delta/mx:0, hi=Math.min(7,Math.floor(h/45)), si=Math.min(3,Math.floor(s*4));
        hist[hi*4+si]+=1;
      }
      for(let i=0;i<hist.length;i++)hist[i]/=n;
      const edges=new Float32Array(9);let total=0;
      for(let y=1;y<47;y++)for(let x=1;x<47;x++){
        const p=y*48+x,gx=gris[p+1]-gris[p-1],gy=gris[p+48]-gris[p-48],mag=Math.hypot(gx,gy);
        if(mag>.08){let a=(Math.atan2(gy,gx)+Math.PI)/(2*Math.PI),bin=Math.min(8,Math.floor(a*9));edges[bin]+=mag;total+=mag;}
      }
      if(total)for(let i=0;i<edges.length;i++)edges[i]/=total;
      return {hist,edges};
    }
    function distanciaDescriptor(a,b){
      if(!a||!b)return Infinity;
      return distanciaMedia(a.hist,b.hist)*5*.62+distanciaMedia(a.edges,b.edges)*2*.38;
    }

    // Huellas regionales genéricas: reutilizables por cualquier entrada con imagen.
    async function huellasRegionalesDesdeSrc(src) {
      const img=await cargarImagen(src), out=[];
      const cortes=[
        [0,0,1,1],[.1,.1,.8,.8],
        [0,0,.6,.6],[.4,0,.6,.6],[0,.4,.6,.6],[.4,.4,.6,.6],
        [.2,0,.6,.7],[.2,.3,.6,.7],[0,.2,.7,.6],[.3,.2,.7,.6]
      ];
      for(const [rx,ry,rw,rh] of cortes){
        const cv=document.createElement('canvas');cv.width=32;cv.height=32;
        const x=Math.round(img.naturalWidth*rx),y=Math.round(img.naturalHeight*ry);
        const w=Math.max(1,Math.round(img.naturalWidth*rw)),h=Math.max(1,Math.round(img.naturalHeight*rh));
        cv.getContext('2d').drawImage(img,x,y,w,h,0,0,32,32);
        out.push(await huellaVisualDesdeSrc(cv.toDataURL('image/jpeg',.82)));
      }
      return out;
    }

    function mejorDistanciaRegional(a,b){
      let best=Infinity;
      for(const x of a)for(const y of b){const d=distanciaVisual(x,y);if(d<best)best=d;}
      return best;
    }

    // v12: descriptor de regiones. Compara partes de la fotografía por separado
    // para que un fondo distinto no domine la decisión.
    async function descriptoresRegionalesDesdeSrc(src) {
      const img=await cargarImagen(src), out=[];
      const cortes=[[0,0,1,1],[.1,.1,.8,.8]];
      // Ventanas pequeñas y solapadas: permiten encontrar un objeto que ocupa
      // solo una fracción de una escena grande (campo, persona, cielo, etc.).
      for(const tam of [.5,.34,.24]){
        const paso= tam===.5 ? .25 : tam===.34 ? .22 : .19;
        for(let y=0;y<=1-tam+.001;y+=paso){
          for(let x=0;x<=1-tam+.001;x+=paso){
            cortes.push([Math.min(x,1-tam),Math.min(y,1-tam),tam,tam]);
          }
        }
      }
      for(const [rx,ry,rw,rh] of cortes){
        const cv=document.createElement('canvas'); cv.width=96; cv.height=96;
        const x=Math.round(img.naturalWidth*rx), y=Math.round(img.naturalHeight*ry);
        const w=Math.max(1,Math.round(img.naturalWidth*rw)), h=Math.max(1,Math.round(img.naturalHeight*rh));
        cv.getContext('2d').drawImage(img,x,y,w,h,0,0,96,96);
        out.push(await descriptorSemanticoDesdeSrc(cv.toDataURL('image/jpeg',.84)));
      }
      return out;
    }

    function mejorDistanciaDescriptorRegional(a,b){
      let best=Infinity;
      for(const x of a)for(const y of b){
        const d=distanciaDescriptor(x,y);
        if(d<best) best=d;
      }
      return best;
    }

    // El buscador compara tanto las imágenes visibles como referenciasVisuales.
    // Las referenciasVisuales entrenan el reconocimiento local pero no se muestran en la entrada.
    function rutasImagenesDe(entry) {
      const rutas = [];
      const vistas = new Set();
      const añadir = (src) => {
        if (typeof src !== 'string') return;
        const limpia = src.trim();
        if (!limpia) return;
        const clave = limpia.split('?')[0];
        if (vistas.has(clave)) return;
        vistas.add(clave);
        rutas.push(limpia);
      };
      if (entry && Array.isArray(entry.imagenes)) entry.imagenes.forEach(añadir);
      if (entry) añadir(entry.imagen);
      if (entry && Array.isArray(entry.referenciasVisuales)) entry.referenciasVisuales.forEach(añadir);
      return rutas;
    }

    // Motor visual v8.
    // Camino A: copia cercana. Sigue exigiendo forma, color, bordes y regiones a la vez.
    // Camino B: solo si la entrada tiene al menos dos fotos visibles. Compara el color
    // muy saturado (el fondo neutro no vota) y exige que varias fotos apoyen. El umbral
    // sale de las propias fotos, dejando una fuera, y tiene que quedar por encima de
    // cualquier otra imagen del diccionario. Una zona de color plano no basta: las fotos
    // de la entrada marcan cuánta variación interna tiene ese color.

    const cacheCroma=new Map();

    function cromaDesdeImagen(img) {
      const S=72, cv=document.createElement('canvas');
      cv.width=S; cv.height=S;
      const ctx=cv.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0,S,S);
      const d=ctx.getImageData(0,0,S,S).data, n=S*S;
      const bins=new Float32Array(24), tono=new Float32Array(n);
      const tonoBin=new Int16Array(n);
      tonoBin.fill(-1);
      for(let p=0,i=0;i<d.length;i+=4,p++){
        const r=d[i]/255, g=d[i+1]/255, b=d[i+2]/255;
        const mx=Math.max(r,g,b), mn=Math.min(r,g,b), delta=mx-mn;
        const sat=mx?delta/mx:0;
        tono[p]=r*.299+g*.587+b*.114;
        if(sat<.8||!delta) continue;
        let h=0;
        if(mx===r) h=((g-b)/delta)%6;
        else if(mx===g) h=(b-r)/delta+2;
        else h=(r-g)/delta+4;
        h=(h*60+360)%360;
        const bin=Math.min(23,Math.floor(((h+7.5)%360)/15));
        tonoBin[p]=bin;
        bins[bin]+=1;
      }
      for(let i=0;i<24;i++) bins[i]/=n;
      const muestras=Array.from({length:24},()=>[]);
      for(let y=1;y<S-1;y++) for(let x=1;x<S-1;x++){
        const p=y*S+x, bin=tonoBin[p];
        if(bin<0) continue;
        let media=0; const vals=[];
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) vals.push(tono[p+dy*S+dx]);
        for(const v of vals) media+=v;
        media/=vals.length;
        let varn=0;
        for(const v of vals) varn+=(v-media)*(v-media);
        muestras[bin].push(Math.sqrt(varn/vals.length));
      }
      const contraste=new Float32Array(24);
      for(let i=0;i<24;i++){
        const m=muestras[i];
        if(m.length<12) continue;
        m.sort((a,b)=>a-b);
        contraste[i]=m[m.length>>1];
      }
      return {bins,contraste};
    }

    async function cromaDesdeSrc(src) {
      const cacheable=typeof src==='string' && !src.startsWith('data:');
      if(cacheable && cacheCroma.has(src)) return cacheCroma.get(src);
      const c=cromaDesdeImagen(await cargarImagen(src));
      if(cacheable) cacheCroma.set(src,c);
      return c;
    }

    function idfCroma(cromas) {
      const N=cromas.length, w=new Float32Array(24);
      for(let i=0;i<24;i++){
        let df=0;
        for(const c of cromas) if(c.bins[i]>.012) df++;
        w[i]=Math.log((N+1)/(df+1));
      }
      return w;
    }

    function interseccionCroma(a,b,w) {
      let s=0;
      for(let i=0;i<24;i++) s+=w[i]*Math.min(a[i],b[i]);
      return s;
    }

    function puntuacionCroma(q, refs, w) {
      const xs=refs.map(r=>interseccionCroma(q.bins,r.bins,w)).sort((a,b)=>b-a);
      if(xs.length<2) return {media:0, apoyo:0};
      const media=(xs[0]+xs[1])/2;
      const corte=Math.max(.02, xs[0]*.45);
      let apoyo=0;
      for(const x of xs) if(x>=corte) apoyo++;
      return {media, apoyo};
    }

    // El color de la firma tiene que variar dentro de la mancha tanto como en las fotos
    // de la entrada. Así un rojo plano (un traje, un recuadro) no hereda el consenso.
    function texturaCompatible(q, refs) {
      for(let i=0;i<24;i++){
        const quienes=refs.filter(r=>r.bins[i]>.012 && r.contraste[i]>0);
        if(quienes.length<2 || q.bins[i]<.012) continue;
        const suelo=Math.min(...quienes.map(r=>r.contraste[i]));
        if(q.contraste[i] < suelo*.55) return false;
      }
      return true;
    }

    // Masa de color saturado que la consulta tiene y que las fotos de la entrada
    // no comparten. Un rojo acompañado de mucho naranja, como una llama, no debe
    // parecerse a un rojo que en la entrada va casi solo.
    function repartoCompatible(q, refs, w) {
      let propia=0, ajena=0;
      for(let i=0;i<24;i++){
        const vals=refs.map(r=>r.bins[i]).sort((a,b)=>b-a);
        const firma=vals[1]||0;
        if(firma>=.012) propia+=w[i]*Math.min(q.bins[i], firma);
        else ajena+=w[i]*q.bins[i];
      }
      return ajena<=Math.max(.035, propia*.8);
    }

    function mediana(xs) {
      const a=xs.slice().sort((p,q)=>p-q);
      const m=Math.floor(a.length/2);
      return a.length%2 ? a[m] : (a[m-1]+a[m])/2;
    }

    // Consenso entre las fotos visibles de una entrada. No usa referencias externas.
    function decidirConsenso(consulta, porPalabra) {
      const pesos=idfCroma(porPalabra.flatMap(p=>p.cromas));
      const candidatos=[];
      for(const grupo of porPalabra){
        if(grupo.cromas.length<2) continue;
        const propias=grupo.cromas;
        const ajenas=porPalabra.filter(p=>p!==grupo).flatMap(p=>p.cromas);
        const loo=[];
        for(let i=0;i<propias.length;i++){
          const resto=propias.filter((_,j)=>j!==i);
          const sc=puntuacionCroma(propias[i], resto, pesos);
          if(sc.apoyo>=2 && texturaCompatible(propias[i], resto) && repartoCompatible(propias[i], resto, pesos)) loo.push(sc.media);
        }
        if(loo.length<2) continue;
        const suelo=mediana(loo);
        let techo=0;
        for(const ajena of ajenas){
          if(!texturaCompatible(ajena, propias) || !repartoCompatible(ajena, propias, pesos)) continue;
          const sc=puntuacionCroma(ajena, propias, pesos);
          if(sc.media>techo) techo=sc.media;
        }
        if(!(suelo>techo*1.12)) continue;
        const umbral=techo+.5*(suelo-techo);
        const sc=puntuacionCroma(consulta, propias, pesos);
        if(!(sc.apoyo>=2 && texturaCompatible(consulta, propias) && repartoCompatible(consulta, propias, pesos) && sc.media>umbral && sc.media>techo*1.12)) continue;
        candidatos.push({palabra:grupo.palabra, score:sc.media});
      }
      candidatos.sort((a,b)=>b.score-a.score);
      if(!candidatos.length) return null;
      if(candidatos[1] && candidatos[0].score<candidatos[1].score*1.12) return null;
      return candidatos[0];
    }

    function mostrarParecida(palabra, detalle, nota) {
      const p=palabra.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
      output.innerHTML='<strong>Imagen parecida encontrada</strong><p><button type="button" id="similar-image-result" style="cursor:pointer;font:inherit;padding:.45rem .75rem;">'+p+' — '+detalle+'</button></p><p>'+nota+'</p>';
      document.getElementById('similar-image-result').addEventListener('click',()=>{document.getElementById('search-input').value=palabra;renderEntry(palabra,false,true);});
      resetBtn.style.display='none'; setMediaButtons(false);
    }

    // Motor visual general: no hay detectores privilegiados por palabra.
    // Cada foto visible de cada entrada participa. Primero se busca una copia cercana.
    // Si no la hay, una entrada con varias fotos puede ganar por consenso de color.

    async function buscarImagenExacta(file) {
      const boton=document.getElementById('image-search-button'),textoOriginal=boton.textContent;
      boton.disabled=true;boton.textContent='…';output.textContent='Comparando con las fotografías del diccionario… (motor local v13)';
      try{
        // v10 local: la búsqueda por fotografía no usa API ni agente externo.
        // Cada imagen visible de una entrada actúa como referencia del objeto.
        output.textContent='Comparando con las fotografías del diccionario… (motor local v13)';
        const buscadaSrc=await archivoADataURL(file);
        const buscada=await huellaVisualDesdeSrc(buscadaSrc);
        const regionesBuscada=await huellasRegionalesDesdeSrc(buscadaSrc);
        const descriptorBuscada=await descriptorSemanticoDesdeSrc(buscadaSrc);
        const descriptoresRegionalesBuscada=await descriptoresRegionalesDesdeSrc(buscadaSrc);
        const cromaBuscada=await cromaDesdeSrc(buscadaSrc);
        const entradas=Object.entries(dictionary).filter(([,e])=>rutasImagenesDe(e).length);
        const candidatos=[];
        const porPalabra=[];
        const gruposVisuales=[];
        for(const [palabra,entry] of entradas){
          let mejorDePalabra=null;
          const cromas=[];
          const coincidencias=[];
          for(const src of rutasImagenesDe(entry)){
            try{
              const firma=await huellaVisualDesdeSrc(src);
              const regionesRef=await huellasRegionalesDesdeSrc(src);
              const global=distanciaVisual(buscada,firma);
              const regional=mejorDistanciaRegional(regionesBuscada,regionesRef);
              const descriptorRef=await descriptorSemanticoDesdeSrc(src);
              const descriptor=distanciaDescriptor(descriptorBuscada,descriptorRef);
              const descriptoresRegionalesRef=await descriptoresRegionalesDesdeSrc(src);
              const descriptorRegional=mejorDistanciaDescriptorRegional(descriptoresRegionalesBuscada,descriptoresRegionalesRef);
              // v12 reduce el peso de la escena completa y premia coincidencias
              // encontradas dentro de una región de la fotografía.
              const peorLocal=Math.max(regional,descriptorRegional);
              const distancia=global*.12+regional*.20+descriptor*.16+descriptorRegional*.40+peorLocal*.12;
              const dato={palabra,distancia,global,regional,descriptor,descriptorRegional};
              coincidencias.push(dato);
              if(!mejorDePalabra||distancia<mejorDePalabra.distancia){
                mejorDePalabra=dato;
              }
              cromas.push(await cromaDesdeSrc(src));
            }catch(_){}
          }
          if(mejorDePalabra) candidatos.push(mejorDePalabra);
          if(coincidencias.length){
            coincidencias.sort((a,b)=>a.distancia-b.distancia);
            gruposVisuales.push({palabra,coincidencias});
          }
          if(cromas.length) porPalabra.push({palabra,cromas});
        }
        candidatos.sort((a,b)=>a.distancia-b.distancia);
        const mejor=candidatos[0]||null, segundo=candidatos[1]||null;
        // El texto escrito en el buscador no interviene: solo se rellena al decidir.
        if(mejor&&mejor.global<=.045){
          document.getElementById('search-input').value=mejor.palabra;renderEntry(mejor.palabra,false,true);return;
        }
        if(mejor){
          const similitud=Math.max(0,Math.min(100,(1-mejor.distancia)*100));
          const similitudGlobal=Math.max(0,(1-mejor.global)*100);
          const similitudRegional=Math.max(0,(1-mejor.regional)*100);
          const similitudDescriptor=Math.max(0,(1-mejor.descriptor)*100);
          // Para proponer una palabra deben coincidir dos señales independientes.
          // Esto sacrifica algunos parecidos débiles para evitar resultados absurdos.
          // Además de superar umbrales, el ganador debe separarse del segundo.
          // Si varias palabras parecen casi igual de plausibles, se rechaza la respuesta.
          const margen=segundo ? segundo.distancia-mejor.distancia : 1;
          const consistente=similitud>=84 && similitudGlobal>=76 && similitudRegional>=80 && similitudDescriptor>=78 && margen>=0.015;
          if(consistente){
            const pct=similitud.toFixed(1).replace('.',',');
            mostrarParecida(mejor.palabra, pct+' % de similitud', 'Coincidencia visual contrastada por forma, color, bordes y regiones.');
            return;
          }
        }
        // v11: consenso multirreferencia. Una entrada con varias fotos puede
        // reconocerse por el patrón compartido de sus mejores referencias, aunque
        // ninguna foto aislada sea casi idéntica a la consulta.
        const votos=gruposVisuales.map(grupo=>{
          const mejores=grupo.coincidencias.slice(0,Math.min(4,grupo.coincidencias.length));
          const cercanas=mejores.filter(x=>x.descriptorRegional<=.24 && x.regional<=.48);
          if(cercanas.length<2) return null;
          const usadas=cercanas.slice(0,3);
          const media=usadas.reduce((a,x)=>a+x.distancia,0)/usadas.length;
          const regional=usadas.reduce((a,x)=>a+x.regional,0)/usadas.length;
          const descriptor=usadas.reduce((a,x)=>a+x.descriptorRegional,0)/usadas.length;
          // Premia que varias referencias encuentren una región parecida al objeto.
          const apoyo=Math.min(3,cercanas.length);
          const score=descriptor*.58 + media*.28 + regional*.05 - apoyo*.035;
          return {palabra:grupo.palabra,score,apoyo,media};
        }).filter(Boolean).sort((a,b)=>a.score-b.score);
        if(votos.length){
          const ganador=votos[0], rival=votos[1];
          const separado=!rival || ganador.score<=rival.score-.025;
          if(ganador.apoyo>=2 && ganador.score<=.245 && separado){
            mostrarParecida(ganador.palabra, ganador.apoyo+' referencias coincidentes', 'Varias fotografías de aprendizaje apoyan la misma entrada; no se exige que la foto nueva sea una copia de una referencia.');
            return;
          }
        }

        const consenso=decidirConsenso(cromaBuscada, porPalabra);
        if(consenso){
          mostrarParecida(consenso.palabra, 'consenso de color', 'Varias fotos visibles de la entrada coinciden en el color saturado. No hace falta que sea una copia de una sola de ellas.');
          return;
        }
        output.innerHTML='<strong>Sin coincidencias.</strong><p>No encontré una coincidencia visual suficientemente consistente. Prefiero no proponer una palabra antes que dar una coincidencia débil.</p>';
        resetBtn.style.display='none';setMediaButtons(false);
      }catch(error){console.error('Error en búsqueda por imagen:',error);output.textContent='No se pudo analizar la imagen seleccionada.';}
      finally{boton.disabled=false;boton.textContent=textoOriginal;}
    }

    document.getElementById('image-search-button').addEventListener('click', () => {
      document.getElementById('image-search-input').click();
    });
    document.getElementById('image-search-input').addEventListener('change', event => {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (file) buscarImagenExacta(file);
    });

    // Listeners
    document.getElementById('search-button').addEventListener('click', ()=>renderEntry(
      document.getElementById('search-input').value.trim(), false, true
    ));
    document.getElementById('search-input').addEventListener('keydown', e=>{
      if(e.key==='Enter') renderEntry(e.target.value.trim(), false, true);
    });

    // Hashchange y popstate
    window.addEventListener('hashchange', ()=>renderEntry(location.hash.slice(1), false, false));
    window.addEventListener('popstate', e=>{
      if(e.state) renderEntry(e.state.term, e.state.plain, false);
      else {
        output.textContent = 'Introduce un término y pulsa “Buscar” para ver la definición.';
        resetBtn.style.display = 'none'; setMediaButtons(false);
        document.getElementById('search-input').value = '';
      }
    });

    // Reset y upload
    resetBtn.addEventListener('click', ()=>renderEntry(currentTerm, true, true));
    uploadBtn.addEventListener('click', ()=>imageInput.click());
    videoUploadBtn.addEventListener('click', ()=>videoInput.click());

    imageInput.addEventListener('change', event=>{
      const file = event.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        const dataURL = reader.result;
        dictionary[currentTerm].imagen = dataURL;
        savedImages[currentTerm] = dataURL;
        localStorage.setItem('dictionaryImages', JSON.stringify(savedImages));
        renderEntry(currentTerm, false, false);
      };
      reader.readAsDataURL(file);
    });

    videoInput.addEventListener('change', event => {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file || !currentTerm) return;
      const nombre = file.name.toLowerCase();
      let mime = file.type;
      if (mime !== 'video/mp4' && mime !== 'video/webm') {
        if (nombre.endsWith('.webm')) mime = 'video/webm';
        else if (nombre.endsWith('.mp4') || nombre.endsWith('.m4v')) mime = 'video/mp4';
      }
      if (mime !== 'video/mp4' && mime !== 'video/webm') {
        alert('Solo se pueden subir videos MP4 o WebM.');
        return;
      }
      if (file.size > 80 * 1024 * 1024) {
        alert('El video es demasiado grande (máximo 80 MB).');
        return;
      }
      idbPut(currentTerm, file).then(() => {
        savedVideos[currentTerm] = mime;
        localStorage.setItem('dictionaryVideos', JSON.stringify(savedVideos));
        if (videoObjectUrls[currentTerm]) URL.revokeObjectURL(videoObjectUrls[currentTerm]);
        videoObjectUrls[currentTerm] = URL.createObjectURL(file);
        dictionary[currentTerm].video = videoObjectUrls[currentTerm];
        dictionary[currentTerm].videoMime = mime;
        renderEntry(currentTerm, false, false);
      }).catch(() => {
        alert('No se pudo guardar el video en este navegador.');
      });
    });


    // Inicialización al cargar
    attachSavedVideos().finally(() => {
      if(location.hash) {
        renderEntry(location.hash.slice(1), false, false);
        history.replaceState({ term: normalizeText(location.hash.slice(1)), plain:false }, '', location.hash);
      } else {
        history.replaceState(null, '', location.pathname);
      }
    });

  </script>
